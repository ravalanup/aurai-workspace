{{- if .Values.databaseBootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: create-openwebui-database
  labels:
    {{- include "aurai-workspace.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: create-openwebui-database
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: psql
          image: {{ .Values.databaseBootstrap.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -d "$DATABASE_ADMIN_URL"; do echo "waiting for postgres"; sleep 2; done
              db="{{ .Values.databaseBootstrap.database }}"
              if psql "$DATABASE_ADMIN_URL" -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
                echo "database $db exists"
              else
                psql "$DATABASE_ADMIN_URL" -c "CREATE DATABASE \"$db\""
              fi
          env:
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: database-admin-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
