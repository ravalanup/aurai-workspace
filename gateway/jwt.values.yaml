# OPTIONAL overlay: verified per-user identity with Keycloak JWTs. Requires a LiteLLM Enterprise license
# (LITELLM_LICENSE); without one the gateway rejects JWT authentication.
# Based on LiteLLM's "Open WebUI for Organizations" guide. Not exercised here: it needs a license key.
#
#   kubectl create secret generic litellm-license -n aurai-gateway --from-literal=license=<key>
#   helm upgrade aurai-gateway ../aurai-gateway/charts/aurai-gateway -n aurai-gateway --reuse-values \
#     -f gateway/jwt.values.yaml
#
# Also switch Open WebUI to forward the user's token: deploy/open-webui-jwt.values.yaml.
# In this mode LiteLLM team ids must equal the Keycloak group names (workspace-members, workspace-builders,
# workspace-admins); create matching teams, and put every user, including admins, in a group.
litellm:
  generalSettings:
    enable_jwt_auth: true
    enforce_team_based_model_access: true
    litellm_jwtauth:
      user_id_jwt_field: email
      user_email_jwt_field: email
      user_id_upsert: true
      team_ids_jwt_field: groups
  extraEnv:
    - name: LITELLM_LICENSE
      valueFrom: {secretKeyRef: {name: litellm-license, key: license}}
    # Keycloak realm "aurai". Setting the audience and issuer stops LiteLLM accepting any token the IdP signs.
    - name: JWT_PUBLIC_KEY_URL
      value: http://keycloak.aurai-system.svc.cluster.local:8080/realms/aurai/protocol/openid-connect/certs
    - name: JWT_AUDIENCE
      value: litellm
    - name: JWT_ISSUER
      value: http://keycloak.aurai-system.svc.cluster.local:8080/realms/aurai
